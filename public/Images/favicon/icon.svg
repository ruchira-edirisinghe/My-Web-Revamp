<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Ruchira Edirisinghe</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ce0ff"/>
      <stop offset="1" stop-color="#bc6fff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#tile)" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="16"/>
  <g transform="translate(-317.42 -59.11) scale(0.42872)">
  
  <!-- RE monogram. Text in the site's off-white; accents in its cyan-to-violet neon (the preloader's and the UI accents' colours). -->
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="871" y1="0" x2="1804" y2="0">
      <stop offset="0" stop-color="#5ce0ff"/>
      <stop offset="1" stop-color="#bc6fff"/>
    </linearGradient>
  </defs>
  <style>
    .main   { fill: #f5f5f7; }
    .accent { fill: url(#accent); }
  </style>

  <g id="logo">
    <g id="R">
      <path id="R-bowl" class="main" d="M871,556 H1207.5 A121.5,121.5 0 0 1 1207.5,799 H1200.5 L1117,727 H1196 A48.5,48.5 0 0 0 1196,630 H935 Z"/>
      <path id="R-leg" class="accent" d="M914,727 H1053 L1270,914 H1131 Z"/>
    </g>
    <g id="E">
      <path id="E-top" class="main" d="M1393,556 H1804 L1740,630 H1393 Z"/>
      <rect id="E-middle" class="accent" x="1393" y="698" width="371" height="74"/>
      <path id="E-bottom" class="main" d="M1393,840 H1740 L1804,914 H1393 Z"/>
    </g>
  </g>
</g>
</svg>
